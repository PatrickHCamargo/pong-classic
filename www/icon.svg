<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="gball" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gpad" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- Center divider -->
  <line x1="68" y1="256" x2="444" y2="256"
        stroke="#1d1d1d" stroke-width="2.5" stroke-dasharray="18,14"/>

  <!-- Score hints -->
  <text x="176" y="248" font-family="monospace" font-size="28" font-weight="bold"
        fill="#2a2a2a" text-anchor="middle">3</text>
  <text x="336" y="248" font-family="monospace" font-size="28" font-weight="bold"
        fill="#2a2a2a" text-anchor="middle">2</text>

  <!-- Top paddle (opponent) — slightly off-center -->
  <rect x="152" y="88" width="180" height="22" rx="11"
        fill="#ffffff" opacity="0.80" filter="url(#gpad)"/>

  <!-- Bottom paddle (player) — centered, wider = "winning" feel -->
  <rect x="118" y="402" width="236" height="26" rx="13"
        fill="#ffffff" filter="url(#gpad)"/>

  <!-- Ball — upper-right quadrant, heading toward top paddle -->
  <circle cx="302" cy="184" r="27"
          fill="#ffffff" filter="url(#gball)"/>
</svg>
