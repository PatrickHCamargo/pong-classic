<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Pong Classic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:         #000000;
            --accent:     #ffffff;
            --text:       #ffffff;
            --subtext:    #888888;
            --glow:       rgba(255,255,255,0.3);
            --btn-bg:     rgba(255,255,255,0.06);
            --btn-border: rgba(255,255,255,0.15);
        }

        html, body {
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            transition: background 0.4s;
        }

        /* ── Telas ── */
        .screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px; gap: 18px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .screen.active { opacity: 1; pointer-events: all; }

        /* ── Menu ── */
        .game-title {
            font-family: 'Orbitron', 'Courier New', monospace;
            font-size: clamp(42px, 14vw, 72px);
            font-weight: 900; letter-spacing: 8px;
            color: var(--accent);
            text-shadow: 0 0 30px var(--glow);
            text-align: center;
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { text-shadow: 0 0 20px var(--glow); }
            50%      { text-shadow: 0 0 50px var(--glow), 0 0 80px var(--glow); }
        }

        .subtitle {
            font-size: 11px; letter-spacing: 4px;
            color: var(--subtext); text-transform: uppercase;
            margin-top: -14px;
        }

        .menu-section { width: 100%; max-width: 320px; }

        .section-label {
            font-size: 9px; letter-spacing: 3px;
            color: var(--subtext); text-transform: uppercase;
            margin-bottom: 8px;
        }

        .btn-group { display: flex; gap: 8px; width: 100%; }

        .btn {
            flex: 1; padding: 12px 6px;
            border-radius: 8px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(10px, 3vw, 12px);
            letter-spacing: 1px;
            cursor: pointer; transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            outline: none; text-align: center;
        }
        .btn.active {
            background: var(--accent); color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--glow);
        }

        /* Botão de ação principal */
        .btn-action {
            width: 100%; max-width: 320px;
            padding: 16px 24px;
            border-radius: 12px;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-family: 'Orbitron', monospace;
            font-size: 15px; font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer; transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            box-shadow: 0 0 16px var(--glow);
            /* Garante altura fixa e não estica */
            height: 56px;
            display: flex; align-items: center; justify-content: center;
            white-space: nowrap;
        }
        .btn-action:active { background: var(--accent); color: #000; transform: scale(0.97); }

        /* Botão secundário — menu, cancelar etc */
        .btn-secondary {
            width: 100%; max-width: 320px;
            padding: 13px 24px;
            border-radius: 10px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--subtext);
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px; letter-spacing: 2px;
            cursor: pointer; transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            /* Altura fixa — sem esticar */
            height: 48px;
            display: flex; align-items: center; justify-content: center;
            white-space: nowrap;
        }
        .btn-secondary:active { background: var(--btn-border); color: var(--text); }

        /* ── Skins ── */
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px; width: 100%; max-width: 320px;
        }

        .skin-card {
            aspect-ratio: 1; border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 4px; transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            position: relative; overflow: hidden;
        }
        .skin-card.active { border-color: var(--accent) !important; }

        .skin-preview { width: 28px; height: 28px; border-radius: 50%; }

        .skin-name {
            font-size: 7px; letter-spacing: 0.5px;
            text-align: center; color: var(--text); opacity: 0.8;
        }
        .skin-lock {
            position: absolute; top: 3px; right: 4px;
            font-size: 8px; color: var(--subtext);
        }
        .skin-timer {
            position: absolute; bottom: 2px;
            font-size: 7px; color: #ffcc00;
        }

        /* ── Tela de jogo ── */
        #screen-game {
            padding: 0; gap: 0;
            justify-content: flex-start;
            background: var(--bg);
        }

        /*
         * ZONAS DE TOQUE — ocupam metade da tela cada
         * A zona do J2 fica no topo (invertida)
         * A zona do J1 fica embaixo
         * O canvas fica sobreposto no meio via position:absolute
         */
        #zone-p2 {
            position: fixed;
            top: 0; left: 0; right: 0;
            bottom: 50%; /* metade superior */
            z-index: 1;
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: 16px;
        }

        #zone-p1 {
            position: fixed;
            top: 50%; left: 0; right: 0;
            bottom: 0; /* metade inferior */
            z-index: 1;
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 16px;
        }

        /* Canvas centralizado sobre as zonas */
        #canvas-wrap {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none; /* deixa o toque passar para as zonas */
        }

        canvas { display: block; }

        /* HUD placar */
        .hud {
            display: flex; flex-direction: column;
            align-items: center; gap: 2px;
            pointer-events: none;
        }

        .hud-score {
            font-family: 'Orbitron', 'Courier New', monospace;
            font-size: clamp(28px, 9vw, 44px);
            font-weight: 900; color: var(--accent);
            text-shadow: 0 0 16px var(--glow); line-height: 1;
        }
        .hud-label { font-size: 8px; letter-spacing: 3px; color: var(--subtext); }

        /* J2 fica invertido */
        #hud-p2 { transform: rotate(180deg); }

        /* Hint de toque */
        .touch-hint {
            font-size: 9px; letter-spacing: 2px;
            color: var(--subtext); opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        #hint-p2 { transform: rotate(180deg); }

        /* Botão de pausa — fixo no centro da tela, sobre o canvas */
        #btn-pause {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.6);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            pointer-events: all;
        }

        /* ── Pausa ── */
        #screen-pause {
            background: rgba(0,0,0,0.88);
            gap: 16px; z-index: 20;
        }
        .pause-title {
            font-family: 'Orbitron', monospace;
            font-size: 28px; font-weight: 700;
            color: var(--accent); letter-spacing: 6px;
        }

        /* ── Fim de jogo ── */
        #screen-gameover {
            background: rgba(0,0,0,0.92);
            gap: 16px; z-index: 20;
        }
        .winner-text {
            font-family: 'Orbitron', monospace;
            font-size: clamp(16px, 5vw, 24px);
            font-weight: 900; color: var(--accent);
            letter-spacing: 2px; text-align: center;
            text-shadow: 0 0 24px var(--glow);
        }
        .final-score {
            font-family: 'Orbitron', monospace;
            font-size: clamp(36px, 12vw, 64px);
            font-weight: 900; color: var(--text);
            letter-spacing: 8px;
        }

        /* ── Anúncio ── */
        #screen-ad {
            background: rgba(0,0,0,0.96);
            gap: 20px; z-index: 30;
        }
        .ad-box {
            width: 100%; max-width: 280px; height: 180px;
            border: 1px solid var(--btn-border);
            border-radius: 12px;
            display: flex; align-items: center;
            justify-content: center; flex-direction: column;
            gap: 10px;
            background: rgba(255,255,255,0.03);
        }
        .ad-icon { font-size: 40px; }
        .ad-text { font-size: 11px; color: var(--subtext); letter-spacing: 2px; }
        #ad-countdown {
            font-family: 'Orbitron', monospace;
            font-size: 36px; font-weight: 900;
            color: var(--accent);
        }

        #btn-ad-skip {
            width: 100%; max-width: 280px;
            height: 52px;
            border-radius: 10px;
            border: 2px solid var(--accent);
            background: var(--accent);
            color: #000;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px; letter-spacing: 2px;
            cursor: pointer; outline: none;
            -webkit-tap-highlight-color: transparent;
            display: flex; align-items: center; justify-content: center;
            /* Bloqueado até o timer acabar */
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: opacity 0.4s, transform 0.4s;
        }
        #btn-ad-skip.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        /* ── Partículas ── */
        #particles { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
        .particle {
            position: absolute; border-radius: 50%;
            animation: part 0.7s ease-out forwards;
        }
        @keyframes part {
            0%   { opacity: 1; transform: scale(1) translate(0,0); }
            100% { opacity: 0; transform: scale(0) translate(var(--tx),var(--ty)); }
        }
    </style>
</head>
<body>

<div id="particles"></div>

<!-- MENU -->
<div class="screen active" id="screen-menu">
    <div class="game-title">PONG</div>
    <div class="subtitle">Classic</div>

    <div class="menu-section">
        <div class="section-label">Modo de jogo</div>
        <div class="btn-group">
            <button class="btn active" id="btn-mode-cpu" onclick="selectMode('cpu')">VS CPU</button>
            <button class="btn"        id="btn-mode-2p"  onclick="selectMode('2p')">2 JOGADORES</button>
        </div>
    </div>

    <div class="menu-section" id="section-difficulty">
        <div class="section-label">Dificuldade</div>
        <div class="btn-group">
            <button class="btn active" id="btn-diff-easy"   onclick="selectDifficulty('easy')">FACIL</button>
            <button class="btn"        id="btn-diff-medium" onclick="selectDifficulty('medium')">MEDIO</button>
            <button class="btn"        id="btn-diff-hard"   onclick="selectDifficulty('hard')">DIFICIL</button>
        </div>
    </div>

    <div class="menu-section">
        <div class="section-label">Skin</div>
        <div class="skins-grid" id="skins-grid"></div>
    </div>

    <button class="btn-action" onclick="startGame()">JOGAR</button>
</div>

<!-- JOGO -->
<div class="screen" id="screen-game">
    <!-- Zona J2 topo — metade superior da tela -->
    <div id="zone-p2">
        <div class="hud" id="hud-p2">
            <div class="hud-score" id="score-p2">0</div>
            <div class="hud-label" id="label-p2">CPU</div>
        </div>
        <span class="touch-hint" id="hint-p2">ARRASTE</span>
    </div>

    <!-- Canvas centralizado -->
    <div id="canvas-wrap">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Botão pausa fixo no centro -->
    <button id="btn-pause" onclick="togglePause()">II</button>

    <!-- Zona J1 baixo — metade inferior da tela -->
    <div id="zone-p1">
        <span class="touch-hint" id="hint-p1">ARRASTE</span>
        <div class="hud" id="hud-p1">
            <div class="hud-score" id="score-p1">0</div>
            <div class="hud-label">VOCE</div>
        </div>
    </div>
</div>

<!-- PAUSA -->
<div class="screen" id="screen-pause">
    <div class="pause-title">PAUSA</div>
    <button class="btn-action" onclick="togglePause()">CONTINUAR</button>
    <button class="btn-secondary" onclick="goToMenu()">MENU</button>
</div>

<!-- FIM DE JOGO -->
<div class="screen" id="screen-gameover">
    <div class="winner-text" id="winner-text">VOCE VENCEU!</div>
    <div class="final-score" id="final-score">5 - 3</div>
    <button class="btn-action" onclick="startGame()">JOGAR NOVAMENTE</button>
    <button class="btn-secondary" onclick="goToMenu()">MENU</button>
</div>

<!-- ANUNCIO -->
<div class="screen" id="screen-ad">
    <div class="section-label">Assistindo anuncio para desbloquear</div>
    <div class="ad-box">
        <div class="ad-icon">📺</div>
        <div class="ad-text">ANUNCIO</div>
        <div id="ad-countdown">5</div>
    </div>
    <button id="btn-ad-skip" onclick="finishAd()">PULAR E DESBLOQUEAR</button>
    <button class="btn-secondary" onclick="cancelAd()">CANCELAR</button>
</div>

<script src="pong.js"></script>
</body>
</html>
