name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/pong-release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android && ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/pong-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pong-classic-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Pong Classic ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            ## 🏓 Pong Classic ${{ github.ref_name }}

            O clássico jogo Pong reinventado para Android, com skins visuais, IA adaptativa e modo multiplayer local.

            ### ✨ O que tem nessa versão

            - **Música de fundo** chiptune em loop (Juhani Junkala — CC0)
            - **Efeitos sonoros** — rebote, ponto marcado e ponto sofrido
            - **Controles de volume** de música e efeitos na tela de pausa
            - **Botão INICIAR** (vs CPU) e **botões PRONTO** (2 jogadores) antes de cada partida
            - **Bola centralizada** no campo ao aguardar início
            - **7 skins visuais** — Classic, Neon, Retro, Cyber, Fire/Ice, Galaxy, Minimal
            - **Modo vs CPU** com 3 dificuldades: Fácil, Médio e Difícil
            - **Modo 2 jogadores** local na mesma tela

            ### 🌐 Versão Web

            Jogue direto no browser em:
            **https://katsuhiro22.github.io/pong-classic**

            ### 📲 Como instalar o APK

            1. Baixe o arquivo `app-release.apk` abaixo
            2. No Android, vá em **Configurações → Segurança → Fontes desconhecidas** e habilite
            3. Abra o APK baixado e instale
